<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intermediate Exercise: Seat Booking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        cinema: { 900: '#111827', 800: '#1F2937', 700: '#374151' },
                        brand: '#F59E0B', // Amber
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0f172a; color: white; }
        
        .screen-curve {
            height: 60px;
            width: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.1), transparent);
            transform: perspective(200px) rotateX(-5deg);
            box-shadow: 0 15px 25px rgba(255, 255, 255, 0.1);
            border-top-left-radius: 50%;
            border-top-right-radius: 50%;
            margin-bottom: 30px;
        }

        .seat {
            height: 32px;
            width: 32px;
            background-color: #475569; /* Slate 600 */
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            transition: all 0.2s ease;
            cursor: pointer;
            position: relative;
        }

        .seat::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 10%;
            width: 80%;
            height: 4px;
            background-color: rgba(0,0,0,0.2);
            border-radius: 2px;
        }

        .seat:hover:not(.occupied) {
            background-color: #64748B;
            transform: scale(1.1);
        }

        .seat.selected {
            background-color: #F59E0B; /* Amber 500 */
        }

        .seat.occupied {
            background-color: #1e293b; /* Slate 800 */
            cursor: not-allowed;
            opacity: 0.7;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 antialiased">

    <!-- 
        EXERCISE INSTRUCTIONS FOR STUDENTS:
        1. Review how CSS Grid is used to create the seating layout.
        2. Study the JS event delegation used for seat clicks.
        3. Tasks to complete:
           - Add a 'VIP' row (e.g., the last row) that costs $20 instead of $12.
           - Prevent users from selecting more than 6 seats at once (show a message).
           - Add a "Clear Selection" button to reset the chosen seats.
    -->

    <div class="max-w-md w-full bg-cinema-800 rounded-3xl shadow-2xl overflow-hidden border border-gray-700">
        
        <!-- Header -->
        <div class="p-6 text-center border-b border-gray-700">
            <h1 class="text-2xl font-bold tracking-wide">DUNE: PART TWO</h1>
            <p class="text-sm text-gray-400 mt-1">Tomorrow, 8:30 PM • Hall 3</p>
        </div>

        <!-- Cinema Layout -->
        <div class="p-8">
            <!-- Screen -->
            <div class="screen-curve"></div>
            
            <!-- Seats Grid -->
            <div class="flex justify-center">
                <div class="grid grid-cols-6 gap-3 sm:gap-4" id="seat-container">
                    <!-- Row 1 -->
                    <div class="seat"></div>
                    <div class="seat"></div>
                    <div class="seat occupied"></div>
                    <div class="seat occupied"></div>
                    <div class="seat"></div>
                    <div class="seat"></div>
                    
                    <!-- Row 2 -->
                    <div class="seat"></div>
                    <div class="seat"></div>
                    <div class="seat"></div>
                    <div class="seat"></div>
                    <div class="seat occupied"></div>
                    <div class="seat occupied"></div>

                    <!-- Row 3 -->
                    <div class="seat occupied"></div>
                    <div class="seat"></div>
                    <div class="seat"></div>
                    <div class="seat"></div>
                    <div class="seat"></div>
                    <div class="seat"></div>

                    <!-- Row 4 -->
                    <div class="seat"></div>
                    <div class="seat"></div>
                    <div class="seat occupied"></div>
                    <div class="seat occupied"></div>
                    <div class="seat occupied"></div>
                    <div class="seat"></div>

                    <!-- Row 5 (Hint for students: Make this VIP) -->
                    <div class="seat"></div>
                    <div class="seat"></div>
                    <div class="seat"></div>
                    <div class="seat"></div>
                    <div class="seat"></div>
                    <div class="seat"></div>
                </div>
            </div>

            <!-- Legend -->
            <div class="flex justify-center gap-6 mt-10 text-sm text-gray-400">
                <div class="flex items-center gap-2">
                    <div class="w-4 h-4 bg-slate-600 rounded-sm"></div> Available
                </div>
                <div class="flex items-center gap-2">
                    <div class="w-4 h-4 bg-amber-500 rounded-sm"></div> Selected
                </div>
                <div class="flex items-center gap-2">
                    <div class="w-4 h-4 bg-slate-800 rounded-sm border border-gray-700"></div> Occupied
                </div>
            </div>
        </div>

        <!-- Checkout Summary -->
        <div class="bg-cinema-900 p-6 flex items-center justify-between">
            <div>
                <p class="text-gray-400 text-sm mb-1">Total Price</p>
                <p class="text-2xl font-bold text-white">$<span id="total-price">0</span></p>
            </div>
            <div class="text-right mr-4">
                <p class="text-gray-400 text-sm mb-1">Seats</p>
                <p class="text-xl font-semibold text-white"><span id="count">0</span></p>
            </div>
            <button id="checkout-btn" class="bg-brand hover:bg-amber-400 text-cinema-900 font-bold py-3 px-6 rounded-xl transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                Book Now
            </button>
        </div>
    </div>

    <!-- Message Container -->
    <div id="message-container" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none z-50">
        Booking confirmed!
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('seat-container');
            const seats = document.querySelectorAll('.seat:not(.occupied)');
            const count = document.getElementById('count');
            const total = document.getElementById('total-price');
            const checkoutBtn = document.getElementById('checkout-btn');
            const messageBox = document.getElementById('message-container');

            const ticketPrice = 12; // Base price for a ticket

            // Update total and count
            function updateSelectedCount() {
                const selectedSeats = document.querySelectorAll('.seat.selected');
                const selectedSeatsCount = selectedSeats.length;

                count.innerText = selectedSeatsCount;
                total.innerText = selectedSeatsCount * ticketPrice;

                // Enable checkout button only if seats are selected
                checkoutBtn.disabled = selectedSeatsCount === 0;
            }

            // Seat click event (Event Delegation on the container)
            container.addEventListener('click', (e) => {
                // Check if a seat was clicked and it's not occupied
                if (e.target.classList.contains('seat') && !e.target.classList.contains('occupied')) {
                    e.target.classList.toggle('selected');
                    updateSelectedCount();
                }
            });

            // Checkout button event
            checkoutBtn.addEventListener('click', () => {
                const selectedCount = document.getElementById('count').innerText;
                if(parseInt(selectedCount) > 0) {
                    messageBox.innerText = `Successfully booked ${selectedCount} seat(s)!`;
                    messageBox.classList.remove('opacity-0');
                    
                    // Reset after 3 seconds
                    setTimeout(() => {
                        messageBox.classList.add('opacity-0');
                        // Mark selected as occupied
                        document.querySelectorAll('.seat.selected').forEach(seat => {
                            seat.classList.remove('selected');
                            seat.classList.add('occupied');
                        });
                        updateSelectedCount();
                    }, 3000);
                }
            });
        });
    </script>
</body>
</html>
